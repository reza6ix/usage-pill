<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { width: 300px; padding: 16px; background: #18181b; color: #fafafa;
         font: 500 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
         -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 14px; font-weight: 650; }
  .icon-btn { all: unset; cursor: pointer; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: rgba(250,250,250,.6); }
  .icon-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .spin svg { animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .row + .row { margin-top: 14px; }
  .rl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .label { color: rgba(250,250,250,.72); }
  .val { font-weight: 650; font-size: 13px; }
  .bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  .sub { margin-top: 7px; font-size: 11px; color: rgba(250,250,250,.5); }
  .msg { color: rgba(250,250,250,.75); line-height: 1.5; font-weight: 450; }
  .msg a { color: #fbbf8a; }
  .foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.07); display: grid; gap: 10px; }
  .line { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: rgba(250,250,250,.5); }
  a.link { color: rgba(250,250,250,.75); text-decoration: none; } a.link:hover { color: #fff; }
  label.toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 12px; color: rgba(250,250,250,.85); }
  label.toggle small { display: block; margin-top: 4px; font-size: 11px; color: rgba(250,250,250,.45); }
  .sw { position: relative; width: 30px; height: 18px; flex: none; }
  .sw input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; }
  .sw span { position: absolute; inset: 0; border-radius: 99px; background: rgba(255,255,255,.15); transition: background .15s; pointer-events: none; }
  .sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked + span { background: #4ade80; }
  .sw input:checked + span::after { transform: translateX(12px); }
  .unhide { all: unset; cursor: pointer; font-size: 11px; color: rgba(250,250,250,.6); text-decoration: underline; }
  kbd { font: inherit; padding: 1px 4px; border-radius: 4px; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
  <div class="head">
    <h1>Claude usage</h1>
    <button class="icon-btn" id="refresh" title="Refresh">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
  <div id="body"><p class="msg">Loading…</p></div>
  <div class="foot">
    <label class="toggle">
      <span>Floating pill on every page<small>Toggle anywhere with <kbd>⌥⇧U</kbd></small></span>
      <span class="sw"><input type="checkbox" id="pill"><span></span></span>
    </label>
    <div class="line" id="hiddenLine" hidden><span id="hiddenText"></span><button class="unhide" id="unhide">Show everywhere</button></div>
    <div class="line"><span id="ago"></span><a class="link" href="https://claude.ai/settings/usage" target="_blank">Usage page ↗</a></div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>

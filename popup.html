<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style id="card-css"></style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0b0c; }
  body { width: 300px; padding: 16px 16px 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-head"><span class="mark"></span><span class="t">Claude usage</span></div>
    <div id="body"><p class="msg">Loading…</p></div>
    <div class="card-foot">
      <button class="btn" id="refresh"><span id="refreshIcon"></span><span id="refreshText">Refresh</span></button>
      <div class="icons">
        <a class="ibtn" id="usage" href="https://claude.ai/settings/usage" target="_blank" title="Open Claude's usage page"></a>
      </div>
    </div>
    <div class="note" id="hiddenNote" hidden><span id="hiddenText"></span><button id="show">Show pill</button></div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
